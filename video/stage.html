<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Groundtruth demo stage</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 22px/1.5 Verdana, Geneva, Tahoma, sans-serif;
        color: #1d1d1d;
        background-color: #b8cce4;
        background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / 0.45) 0 1px, transparent 1px 6px);
        display: grid;
        place-items: center;
      }
      .card {
        width: 960px;
        background: #fff;
        border: 1px solid #5d7598;
        box-shadow: 6px 6px 0 rgb(20 40 80 / 0.25);
      }
      .bar {
        padding: 22px 30px 18px;
        color: #fff;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.22) 0%, rgb(255 255 255 / 0.06) 50%, transparent 50%),
          linear-gradient(180deg, #3d82dc 0%, #2259a6 55%, #163a69 100%);
        border-bottom: 6px solid #f39c12;
      }
      h1 { margin: 0; font: bold 60px/1.1 Georgia, serif; text-shadow: 2px 2px 0 rgb(0 0 0 / 0.35); }
      .sub { margin: 6px 0 0; font: italic 26px Georgia, serif; color: #dce6f5; }
      .body { padding: 26px 30px 30px; }
      .body p { margin: 0 0 16px; }
      .body p:last-child { margin-bottom: 0; }
      .tag {
        display: inline-block;
        padding: 2px 12px;
        margin: 0 8px 8px 0;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
        font-size: 20px;
        background: #2a5fae;
      }
      .tag.red { background: #d0311f; }
      .tag.green { background: #2e8b3a; }
      .tag.orange { background: #d97a00; }
      .tag.grey { background: #555; }
      .mono { font-family: "Liberation Mono", "Courier New", monospace; }
      .term {
        width: 1060px;
        height: 470px;
        background: #0b0f14;
        border: 1px solid #5d7598;
        box-shadow: 6px 6px 0 rgb(20 40 80 / 0.25);
        display: flex;
        flex-direction: column;
      }
      .term-bar {
        padding: 6px 14px;
        font: bold 18px "Trebuchet MS", Verdana, sans-serif;
        color: #fff;
        background: linear-gradient(180deg, #4a8be0 0%, #2a5fae 100%);
      }
      .term pre {
        margin: 0;
        padding: 14px 18px;
        flex: 1;
        overflow: hidden;
        font: 17px/1.45 "Liberation Mono", "Courier New", monospace;
        color: #cfe3cf;
        white-space: pre-wrap;
        word-break: break-all;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .term .hl { color: #ffd166; }
      .term .bad { color: #ff7b6b; }
      .term .ok { color: #7ee08a; }
      .term .dim { color: #7d8b99; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
  </body>
</html>
