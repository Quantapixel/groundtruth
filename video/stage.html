<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Groundtruth demo stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(ellipse at center, #0d1a10 0%, #050806 70%);
        color: #b8f5b0;
        font: 30px/1.4 "VT323", "Liberation Mono", monospace;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      #stage { width: 1000px; }
      .glow { text-shadow: 0 0 6px rgb(120 255 120 / 0.55), 0 0 18px rgb(80 255 80 / 0.25); }
      .amber { color: #ffc35a; text-shadow: 0 0 8px rgb(255 180 60 / 0.45); }
      .red { color: #ff6a55; text-shadow: 0 0 8px rgb(255 80 60 / 0.5); }
      .grey { color: #9aa39a; }
      .dim { color: #5e7a5e; }

      /* Title */
      .title { text-align: center; }
      .title h1 {
        margin: 0;
        font-size: 150px;
        line-height: 1;
        letter-spacing: 0.06em;
        color: #c6ffbf;
        position: relative;
        animation: jitter 3.2s infinite steps(1);
      }
      .title h1::before, .title h1::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        opacity: 0.75;
        mix-blend-mode: screen;
      }
      .title h1::before { color: #ff3355; animation: glitch-a 2.3s infinite steps(1); }
      .title h1::after { color: #33ccff; animation: glitch-b 1.9s infinite steps(1); }
      .title p { margin: 18px 0 0; font-size: 40px; }
      .rule { height: 2px; margin: 26px auto 0; width: 70%; background: linear-gradient(90deg, transparent, #ffc35a, transparent); }

      /* Story lines */
      .story { font-size: 46px; line-height: 1.35; }
      .story .line { opacity: 0; transform: translateY(8px); transition: opacity 0.35s, transform 0.35s; margin: 0 0 26px; }
      .story .line.on { opacity: 1; transform: none; }
      .story .prompt { color: #5e7a5e; margin-right: 14px; }

      /* Terminal */
      .term { width: 1040px; height: 520px; border: 2px solid #2b4a2e; background: rgb(0 0 0 / 0.55); display: flex; flex-direction: column; box-shadow: 0 0 40px rgb(60 255 60 / 0.08) inset; }
      .term-bar { padding: 4px 14px; font-size: 26px; color: #ffc35a; border-bottom: 1px solid #2b4a2e; }
      .term pre {
        margin: 0; padding: 12px 16px; flex: 1; overflow: hidden;
        font: 24px/1.3 "VT323", "Liberation Mono", monospace;
        white-space: pre-wrap; word-break: break-all;
        display: flex; flex-direction: column; justify-content: flex-end;
      }
      .term .bad { color: #ff6a55; }
      .term .ok { color: #7dff8a; }
      .term .hl { color: #ffc35a; }
      .term .dim { color: #5e7a5e; }
      .cursor { animation: blink 1s steps(1) infinite; }

      /* End */
      .end { text-align: center; font-size: 40px; }
      .end h1 { margin: 0 0 10px; font-size: 120px; letter-spacing: 0.06em; }
      .end p { margin: 8px 0; }

      /* CRT power on / off */
      body.on #stage { animation: poweron 0.7s ease-out both; }
      body.off #stage { animation: poweroff 0.6s ease-in forwards; }
      body.on::after, body.off::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: #eaffea; animation: flash 0.7s ease-out forwards; }
      @keyframes poweron { 0% { transform: scale(1.2, 0.004); filter: brightness(6); } 45% { transform: scale(1, 0.01); filter: brightness(4); } 100% { transform: none; filter: none; } }
      @keyframes poweroff { 0% { transform: none; } 55% { transform: scale(1, 0.006); filter: brightness(5); } 100% { transform: scale(0, 0.006); filter: brightness(8); opacity: 0; } }
      @keyframes flash { 0% { opacity: 0.0; } 15% { opacity: 0.35; } 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes jitter { 0%, 100% { transform: none; } 92% { transform: translate(2px, -1px); } 94% { transform: translate(-3px, 1px) skewX(4deg); } 96% { transform: none; } }
      @keyframes glitch-a { 0%, 100% { transform: translate(0); clip-path: inset(0 0 100% 0); } 88% { transform: translate(-6px, 0); clip-path: inset(20% 0 55% 0); } 91% { transform: translate(5px, 0); clip-path: inset(60% 0 10% 0); } 94% { clip-path: inset(0 0 100% 0); } }
      @keyframes glitch-b { 0%, 100% { transform: translate(0); clip-path: inset(100% 0 0 0); } 85% { transform: translate(6px, 0); clip-path: inset(40% 0 35% 0); } 89% { transform: translate(-4px, 0); clip-path: inset(5% 0 75% 0); } 93% { clip-path: inset(100% 0 0 0); } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const $ = (id) => document.getElementById(id)
      window.show = (html) => { $("stage").innerHTML = html }
      window.reveal = (i) => document.querySelectorAll(".line")[i]?.classList.add("on")
      window.termLine = (html) => $("t")?.insertAdjacentHTML("beforeend", `<div>${html || "&nbsp;"}</div>`)
    </script>
  </body>
</html>
